<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام الأرشفة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #f8f9fa; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: Tahoma, sans-serif; 
        }
        .login-card { 
            width: 100%; 
            max-width: 420px; 
            border: none; 
            border-radius: 16px; 
            box-shadow: 0 4px 24px rgba(0,0,0,0.06); 
            padding: 40px 30px;
            background: white;
        }
        .icon-box {
            width: 60px;
            height: 60px;
            background-color: #e8f5e9;
            color: #2e7d32;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            margin: 0 auto 20px auto;
            font-size: 24px;
        }
        .btn-success-custom {
            background-color: #10b981;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .btn-success-custom:hover {
            background-color: #059669;
        }
        .form-control {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
            border-color: #10b981;
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="icon-box">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </div>
        
        <h3 class="text-center fw-bold text-dark mb-1">Welcome back</h3>
        <p class="text-center text-muted mb-4 small">Log in to your account</p>
        
        {% if error %}
            <div class="alert alert-danger py-2 text-center small" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Email</label>
                <input type="email" name="email" class="form-control" required placeholder="you@example.com">
            </div>
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label text-muted small fw-bold">Password</label>
                </div>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-success-custom w-100 shadow-sm">Log in</button>
        </form>
    </div>

</body>
</html>
