<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة إرسال الطلبات للمشاريع</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; align-items: center; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-primary { background: #0066cc; border: none; padding: 10px; font-size: 1.1rem; transition: all 0.3s; }
        .btn-primary:hover { background: #004999; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container my-5" style="max-width: 650px;">
        <div class="card p-5 bg-white">
            <div class="text-center mb-4">
                <i class="fa-solid fa-paper-plane fa-3x text-primary mb-3"></i>
                <h2 class="fw-bold text-dark">بوابة إرسال الطلبات</h2>
                <p class="text-muted">يرجى تعبئة تفاصيل الطلب بدقة لإرساله إلى الإدارة</p>
            </div>
            
            {% if success %}
                <div class="alert alert-success text-center fw-bold py-3" role="alert">
                    <i class="fa-solid fa-check-circle me-2"></i> تم إرسال طلبك بنجاح إلى الإدارة!
                </div>
            {% endif %}

            <form action="/client" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary"><i class="fa-solid fa-building me-1"></i> اسم الجهة / المشروع:</label>
                    <input type="text" class="form-control form-control-lg bg-light" name="client_name" required placeholder="أدخل اسم الجهة أو المشروع...">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary"><i class="fa-solid fa-pen-to-square me-1"></i> محتوى الطلب / التفاصيل:</label>
                    <textarea class="form-control bg-light" name="content" rows="4" required placeholder="اكتب تفاصيل الطلب والمستندات المطلوبة..."></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary"><i class="fa-solid fa-paperclip me-1"></i> إرفاق ملف (اختياري):</label>
                    <input class="form-control bg-light" type="file" name="file">
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">
                    <i class="fa-solid fa-arrow-up-from-bracket me-2"></i> إرسال الطلب الآن
                </button>
            </form>
        </div>
    </div>
</body>
</html>
